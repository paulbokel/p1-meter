name: p1-monitor

x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-p1}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-p1}

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-p1}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.migrate"]
    environment: *db-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  collector:
    build: ./collector
    restart: unless-stopped
    environment:
      <<: *db-env
      P1_HOST: ${P1_HOST:-192.168.178.187}
      P1_DRIVER: ${P1_DRIVER:-v1}
      P1_POLL_INTERVAL: ${P1_POLL_INTERVAL:-1}
      P1_TOKEN: ${P1_TOKEN:-}
      P1_CA_FILE: ${P1_CA_FILE:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate: { condition: service_completed_successfully }

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment: *db-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      <<: *db-env
      FETCH_PRICES: ${FETCH_PRICES:-false}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # MQTT publication + Home Assistant discovery (F-EXP-03). Enable with
  # `docker compose --profile mqtt up -d` and set MQTT_HOST in .env.
  mqtt:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "app.mqtt_bridge"]
    profiles: ["mqtt"]
    restart: unless-stopped
    environment:
      <<: *db-env
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-p1monitor}
      MQTT_DISCOVERY_PREFIX: ${MQTT_DISCOVERY_PREFIX:-homeassistant}
      MQTT_INTERVAL: ${MQTT_INTERVAL:-5}
    depends_on:
      migrate: { condition: service_completed_successfully }

  backup:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-p1}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: Europe/Amsterdam
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    profiles: ["proxy"]
    environment:
      P1_HOSTNAME: ${P1_HOSTNAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [backend]

  fake-meter:
    image: python:3.12-slim
    profiles: ["dev"]
    command: ["python", "/fake_meter.py", "--port", "80"]
    volumes:
      - ./devtools/fake_meter.py:/fake_meter.py:ro

volumes:
  db-data:
  caddy-data:
